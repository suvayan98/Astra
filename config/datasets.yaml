datasets:
  bhoonidhi:
    name: "Bhoonidhi Open Data Archive"
    portal: "Bhoonidhi"
    agency: "National Remote Sensing Centre (NRSC) / ISRO"
    url: "https://bhoonidhi.nrsc.gov.in"
    datasets:
      cartodem_30m:
        id: "cartodem_30m"
        title: "CartoDEM Version 3 R1 (30m)"
        description: "High-resolution digital elevation model derived from Cartosat-1 stereo pairs covering the Indian subcontinent."
        resolution: "30m"
        vertical_accuracy: "±8m"
        vintage: "2019-2022"
        format: "GeoTIFF"
        crs: "EPSG:4326 / UTM projected"
        indicators:
          - mean_slope_deg
          - slope_buildable_share
          - terrain_roughness_tri
          - elevation_relief_m
          - hand_flood_risk_fraction
        access:
          method: "REST API / Pre-packaged GeoTIFF / Offline Fixture"
          requires_auth: true
          offline_fixture: "data/cache/regions/{region_id}/dem.tif"

  bhuvan:
    name: "Bhuvan Geoportal"
    portal: "Bhuvan"
    agency: "National Remote Sensing Centre (NRSC) / ISRO"
    url: "https://bhuvan.nrsc.gov.in"
    datasets:
      lulc_50k:
        id: "lulc_50k"
        title: "Bhuvan Land Use / Land Cover 1:50,000"
        description: "18-class national land use land cover map mapped from multi-temporal Resourcesat LISS-III data."
        resolution: "30m"
        vintage: "2021-2022"
        format: "WMS / GeoTIFF"
        classes:
          1: "Built-up"
          2: "Cropland"
          3: "Forest / Plantation"
          4: "Wasteland / Scrubland"
          5: "Water bodies"
          6: "Wetland / Marsh"
        indicators:
          - dominant_lulc
          - wasteland_share
          - forest_clearing_penalty
          - wetland_fraction
        access:
          method: "OGC WMS / Offline Fixture"
          wms_url: "https://bhuvan-vec2.nrsc.gov.in/bhuvan/wms"
          offline_fixture: "data/cache/regions/{region_id}/lulc.tif"

      flood_hazard:
        id: "flood_hazard"
        title: "Bhuvan Historical Flood Inundation Hazard Zonation"
        description: "Multi-year satellite flood inundation frequency and hazard layers generated by Disaster Management Support Group (DMSG)."
        resolution: "30m"
        vintage: "2018-2023"
        hazard_levels:
          0: "No Flood Recorded"
          1: "Low Inundation Frequency"
          2: "Moderate Inundation Hazard"
          3: "High Flood Hazard (Deal-breaker candidate)"
        indicators:
          - flood_hazard_fraction
          - high_flood_hazard_pct
        access:
          method: "WMS / Vector Mask / Offline Fixture"
          offline_fixture: "data/cache/regions/{region_id}/flood.tif"

      geomorphology_water:
        id: "geomorphology_water"
        title: "Bhuvan Geomorphological & Groundwater Prospects"
        description: "Hydro-geomorphological classification assessing aquifer recharge and groundwater potential."
        resolution: "50m"
        vintage: "2020"
        indicators:
          - groundwater_prospect
          - dist_to_surface_water_km
        access:
          method: "WMS / GeoJSON / Offline Fixture"

  mosdac:
    name: "MOSDAC Satellite Meteorological Data"
    portal: "MOSDAC"
    agency: "Space Applications Centre (SAC) / ISRO"
    url: "https://mosdac.gov.in"
    datasets:
      insat3d_rainfall:
        id: "insat3d_rainfall"
        title: "INSAT-3D / 3DR Hydro-Estimator Precipitation Climatology"
        description: "Satellite-derived precipitation time series providing 10-year monthly and annual rainfall statistics and dry season severity."
        resolution: "4km (regionalized)"
        vintage: "2014-2024"
        format: "NetCDF / JSON Summary"
        indicators:
          - annual_rainfall_mean_mm
          - rainfall_cv_pct
          - dry_months_count
          - drought_exposure_index
        access:
          method: "REST API / Offline JSON Fixture"
          offline_fixture: "data/cache/regions/{region_id}/rainfall.json"

  vedas:
    name: "VEDAS Earth Observation & Solar/Agri Portal"
    portal: "VEDAS"
    agency: "Space Applications Centre (SAC) / ISRO"
    url: "https://vedas.sac.gov.in"
    datasets:
      sentinel2_ndvi:
        id: "sentinel2_ndvi"
        title: "VEDAS Sentinel-2 High-Resolution NDVI 10m"
        description: "Normalized Difference Vegetation Index computed from Sentinel-2 MSI multi-spectral surface reflectance."
        resolution: "10m"
        vintage: "2023-2024"
        format: "OGC WMS / GeoTIFF"
        indicators:
          - mean_ndvi
          - ndvi_trend
          - ecological_sensitivity_score
        access:
          method: "OGC WMS / Offline Fixture"
          wms_url: "https://vedas.sac.gov.in/vedas/wms"
          offline_fixture: "data/cache/regions/{region_id}/ndvi_grid.tif"

  osm:
    name: "OpenStreetMap Infrastructure Network"
    portal: "OpenStreetMap"
    agency: "OpenStreetMap Contributors / Overpass API"
    url: "https://overpass-api.de"
    datasets:
      infra_layers:
        id: "osm_infra"
        title: "Transport, Power and Civic Infrastructure"
        description: "Major highways, secondary roads, electrical substations, hospitals, and educational facilities."
        vintage: "2024"
        format: "GeoJSON"
        indicators:
          - dist_to_major_road_km
          - dist_to_substation_km
          - dist_to_healthcare_km
          - dist_to_education_km
        access:
          method: "Overpass QL / Offline GeoJSON Fixture"
          offline_fixture: "data/cache/regions/{region_id}/osm_infra.geojson"

  seismic_gsi:
    name: "Bureau of Indian Standards & Geological Survey of India"
    portal: "NDMA / BIS / GSI"
    agency: "Government of India"
    datasets:
      is_1893_seismic:
        id: "seismic_zones"
        title: "IS 1893: 2016 Seismic Zone Map of India"
        description: "Standard earthquake hazard zonation dividing India into Zones II, III, IV, and V."
        indicators:
          - seismic_zone
          - seismic_hazard_factor_z
        access:
          offline_fixture: "data/static/seismic_zones.geojson"
      landslide_inventory:
        id: "landslide_inventory"
        title: "GSI National Landslide Susceptibility Mapping (NLSM)"
        description: "Inventory of historical and high-susceptibility landslide polygons across India."
        indicators:
          - dist_to_landslide_km
          - landslide_hazard_level
        access:
          offline_fixture: "data/static/landslide_inventory.geojson"

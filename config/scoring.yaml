version: "1.0"

presets:
  balanced:
    name: "Balanced"
    description: "Equitable weighting across hazard resilience, water resources, infrastructure, and terrain."
    weights:
      terrain_and_land: 20.0
      water_security: 25.0
      hazard_risk: 30.0
      environmental_impact: 10.0
      infrastructure_access: 15.0

  climate_resilient:
    name: "Climate-Resilient"
    description: "Prioritizes long-term climate risk avoidance: heightened flood, landslide, seismic safety, and water security."
    weights:
      terrain_and_land: 10.0
      water_security: 30.0
      hazard_risk: 40.0
      environmental_impact: 10.0
      infrastructure_access: 10.0

  infra_first:
    name: "Infra-First"
    description: "Prioritizes rapid urban development, capital expenditure efficiency, and proximity to arterial transport and power grids."
    weights:
      terrain_and_land: 25.0
      water_security: 15.0
      hazard_risk: 20.0
      environmental_impact: 10.0
      infrastructure_access: 30.0

pillars:
  terrain_and_land:
    name: "Terrain & Land"
    description: "Topographic suitability, buildable slope share, terrain roughness, and land development efficiency."
    indicators:
      slope_buildable_share:
        name: "Buildable Slope Share (<= 15% slope)"
        description: "Fraction of site area with slope <= 15% suitable for construction. Score: >= 0.80 -> 100, <= 0.20 -> 0, linear between."
        unit: "fraction"
        weight: 0.35
        direction: "higher_is_better"
        scoring_type: "piecewise"
        points:
          - [0.0, 0.0]
          - [0.20, 0.0]
          - [0.80, 100.0]
          - [1.0, 100.0]
        portal: "Bhoonidhi"
        dataset: "CartoSat-1_PAN_CartoDEM_30m"

      terrain_roughness:
        name: "Terrain Roughness (TRI std dev)"
        description: "Mean Terrain Ruggedness Index or local elevation std dev in metres. < 3m -> 100, 3-10m -> 60, > 15m -> 20."
        unit: "m"
        weight: 0.25
        direction: "lower_is_better"
        scoring_type: "piecewise"
        points:
          - [0.0, 100.0]
          - [3.0, 100.0]
          - [10.0, 60.0]
          - [15.0, 20.0]
          - [30.0, 10.0]
        portal: "Bhoonidhi"
        dataset: "CartoSat-1_PAN_CartoDEM_30m"

      land_cover_conversion:
        name: "Land Cover Conversion Suitability"
        description: "Area-weighted score by LULC class: Barren/Wasteland/Scrub (95), Fallow/Single-crop (65), Irrigated Double-crop (30), Built-up (25), Forest (10), Wetland (0)."
        unit: "index"
        weight: 0.25
        direction: "piecewise"
        scoring_type: "piecewise"
        points:
          - [0.0, 0.0]
          - [100.0, 100.0]
        portal: "Bhuvan"
        dataset: "LULC 250k / 50k"

      geomorphology_constraint:
        name: "Geomorphology Constraint"
        description: "Alluvial plain / Pediplain (100), Dissected plateau / Foothills (60), Active floodplain / Marsh / Steep hills (15)."
        unit: "class"
        weight: 0.15
        direction: "categorical"
        scoring_type: "categorical"
        categories:
          Alluvial plain: 100.0
          Pediplain: 100.0
          Stable upland plateau: 100.0
          Dissected plateau: 60.0
          Piedmont: 60.0
          Foothills: 60.0
          Active floodplain: 15.0
          Marsh: 15.0
          Steep structural hills: 15.0
          Moderate: 60.0
          Favorable: 100.0
        portal: "Bhuvan"
        dataset: "Geomorphology"

  water_security:
    name: "Water"
    description: "Rainfall availability, climatic variability, groundwater prospects, and regional freshwater access."
    indicators:
      rainfall_mean_annual:
        name: "Annual Mean Rainfall"
        description: "Piecewise-linear: < 300 mm -> 20, 700-1600 mm -> 100, > 2800 mm -> 40."
        unit: "mm/yr"
        weight: 0.30
        direction: "piecewise"
        scoring_type: "piecewise"
        points:
          - [100.0, 10.0]
          - [300.0, 20.0]
          - [700.0, 100.0]
          - [1600.0, 100.0]
          - [2800.0, 40.0]
          - [3500.0, 20.0]
        portal: "MOSDAC"
        dataset: "INSAT-3D Daily Rainfall"

      rainfall_variability:
        name: "Precipitation Coefficient of Variation (CV)"
        description: "CV <= 0.15 -> 100, CV >= 0.45 -> 20, linear between."
        unit: "fraction"
        weight: 0.25
        direction: "lower_is_better"
        scoring_type: "piecewise"
        points:
          - [0.05, 100.0]
          - [0.15, 100.0]
          - [0.45, 20.0]
          - [0.70, 10.0]
        portal: "MOSDAC"
        dataset: "INSAT-3D Daily Rainfall"

      groundwater_prospect:
        name: "Groundwater Prospects"
        description: "Good -> 100, Moderate -> 60, Poor -> 20."
        unit: "class"
        weight: 0.25
        direction: "categorical"
        scoring_type: "categorical"
        categories:
          Good: 100.0
          Moderate: 60.0
          Poor: 20.0
          Very Poor: 10.0
        portal: "Bhuvan"
        dataset: "Groundwater Prospects"

      surface_water_access:
        name: "Distance to Perennial Surface Water"
        description: "Distance to nearest perennial water body: < 2 km -> 100, 2-5 km -> 75, 5-15 km -> 45, > 15 km -> 15."
        unit: "km"
        weight: 0.20
        direction: "lower_is_better"
        scoring_type: "piecewise"
        points:
          - [0.5, 100.0]
          - [2.0, 100.0]
          - [5.0, 75.0]
          - [15.0, 45.0]
          - [30.0, 15.0]
        portal: "Bhuvan"
        dataset: "Water Bodies"

  hazard_risk:
    name: "Hazards"
    description: "Flood hazard zonation, landslide susceptibility, seismic vulnerability, and drought-heat exposure."
    indicators:
      flood_hazard:
        name: "Flood Hazard Inundation Score"
        description: "Primary real Bhuvan: Very Low=100, Low=75, Moderate=50, High=25, Very High=0. Or HAND proxy fraction < 2m (<= 0.05 -> 90, >= 0.50 -> 15)."
        unit: "score"
        weight: 0.35
        direction: "piecewise"
        scoring_type: "piecewise"
        points:
          - [0.0, 0.0]
          - [25.0, 25.0]
          - [50.0, 50.0]
          - [75.0, 75.0]
          - [100.0, 100.0]
        portal: "Bhuvan"
        dataset: "Flood Hazard Atlas"

      landslide_hazard:
        name: "Landslide Hazard & Susceptibility"
        description: "Mapped landslide density within 5 km. Sites in non-hilly terrain (slope < 5% and relief < 50m) score 100."
        unit: "score"
        weight: 0.25
        direction: "piecewise"
        scoring_type: "piecewise"
        points:
          - [0.0, 0.0]
          - [20.0, 20.0]
          - [60.0, 60.0]
          - [100.0, 100.0]
        portal: "Bhuvan"
        dataset: "Landslide Hazard Inventory"

      seismic_zone:
        name: "IS 1893 Seismic Vulnerability Zone"
        description: "Zone II -> 100, Zone III -> 70, Zone IV -> 40, Zone V -> 10."
        unit: "zone"
        weight: 0.20
        direction: "categorical"
        scoring_type: "categorical"
        categories:
          "Zone II": 100.0
          "Zone III": 70.0
          "Zone IV": 40.0
          "Zone V": 10.0
        portal: "External"
        dataset: "BIS IS 1893"

      drought_heat_exposure:
        name: "Drought and Heat Exposure"
        description: "Low (<= 4 dry months, CV < 0.20 -> 90), Moderate (5-7 dry months -> 55), High (>= 8 dry months or CV >= 0.40 -> 20)."
        unit: "score"
        weight: 0.20
        direction: "piecewise"
        scoring_type: "piecewise"
        points:
          - [0.0, 20.0]
          - [20.0, 20.0]
          - [55.0, 55.0]
          - [90.0, 90.0]
          - [100.0, 100.0]
        portal: "MOSDAC"
        dataset: "INSAT-3D Daily Rainfall"

  environmental_impact:
    name: "Environment"
    description: "Vegetation NDVI cross-validated with Bhuvan LULC, ecological integrity, and air quality."
    indicators:
      vegetation_ndvi_mean:
        name: "Sentinel-2 Mean NDVI (Cross-Validated with LULC)"
        description: "Low NDVI (< 0.25) + Wasteland -> 90-100; High NDVI (> 0.50) + Forest -> 15-25 penalty; High NDVI (> 0.45) + Cropland -> 30-40 penalty; Moderate -> 60-75."
        unit: "index"
        weight: 0.50
        direction: "piecewise"
        scoring_type: "piecewise"
        points:
          - [0.0, 80.0]
          - [0.25, 95.0]
          - [0.45, 65.0]
          - [0.60, 40.0]
          - [0.85, 15.0]
        portal: "VEDAS"
        dataset: "Sentinel-2 NDVI"

      vegetation_ndvi_trend:
        name: "Sentinel-2 NDVI Multi-Year Trend"
        description: "Multi-year slope: stable/neutral -> 80, sharp declining (< -0.02/yr) -> 40 + warning."
        unit: "slope/yr"
        weight: 0.35
        direction: "piecewise"
        scoring_type: "piecewise"
        points:
          - [-0.05, 30.0]
          - [-0.02, 40.0]
          - [0.0, 80.0]
          - [0.03, 85.0]
        portal: "VEDAS"
        dataset: "Sentinel-2 NDVI"

      air_quality:
        name: "Air Quality Indicator"
        description: "Optional VEDAS air quality index. Returns None/missing if unavailable."
        unit: "AQI"
        weight: 0.15
        direction: "lower_is_better"
        scoring_type: "piecewise"
        points:
          - [50.0, 100.0]
          - [100.0, 75.0]
          - [200.0, 40.0]
          - [350.0, 10.0]
        portal: "VEDAS"
        dataset: "VEDAS Air Quality"

  infrastructure_access:
    name: "Infrastructure Access"
    description: "Proximity to primary transport corridors, healthcare/education, and power transmission grid."
    indicators:
      road_access:
        name: "Distance to Major Road / Expressway"
        description: "Distance within 15 km buffer: <= 2 km -> 100, 2-5 km -> 75, 5-10 km -> 45, 10-15 km -> 20, > 15 km -> 5."
        unit: "km"
        weight: 0.40
        direction: "lower_is_better"
        scoring_type: "piecewise"
        points:
          - [0.5, 100.0]
          - [2.0, 100.0]
          - [5.0, 75.0]
          - [10.0, 45.0]
          - [15.0, 20.0]
          - [25.0, 5.0]
        portal: "External"
        dataset: "OpenStreetMap Highway Network"

      hospital_school_access:
        name: "Distance to Essential Healthcare & Education"
        description: "Distance within 15 km buffer: <= 2 km -> 100, 2-5 km -> 75, 5-10 km -> 45, 10-15 km -> 20, > 15 km -> 5."
        unit: "km"
        weight: 0.30
        direction: "lower_is_better"
        scoring_type: "piecewise"
        points:
          - [1.0, 100.0]
          - [2.0, 100.0]
          - [5.0, 75.0]
          - [10.0, 45.0]
          - [15.0, 20.0]
          - [25.0, 5.0]
        portal: "External"
        dataset: "OpenStreetMap Social Infrastructure"

      power_grid_access:
        name: "Distance to Power Substation / Transmission Line"
        description: "Distance within 15 km buffer: <= 2 km -> 100, 2-5 km -> 75, 5-10 km -> 45, 10-15 km -> 20, > 15 km -> 5."
        unit: "km"
        weight: 0.30
        direction: "lower_is_better"
        scoring_type: "piecewise"
        points:
          - [1.0, 100.0]
          - [2.0, 100.0]
          - [5.0, 75.0]
          - [10.0, 45.0]
          - [15.0, 20.0]
          - [25.0, 5.0]
        portal: "External"
        dataset: "OpenStreetMap Power Grid"

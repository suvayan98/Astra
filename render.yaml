services:
  - type: web
    name: terracity-ai
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: BHOONIDHI_USER
        sync: false
      - key: BHOONIDHI_PASSWORD
        sync: false
      - key: VEDAS_API_KEY
        sync: false
      - key: OFFLINE_MODE
        value: "false"
      - key: DATA_DIR
        value: ./data
